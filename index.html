<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARC FRANZEN B. CASTILLO PORTFOLIO</title>
</head>
<body>

<div class="DIV">

    <form id="fill">

        <div class="please">
            <p id="pl" style="cursor: default;">
                PORTFOLIO
            </p>
        </div>
        
     <div>
    <input class="required-field" id="input-email" type="email" required placeholder="Email (example@gmail.com)">
     </div>

     <div>
    <input class="required-field" id="input-pass" type="password" required placeholder="Password" minlength="5" maxlength="15">
    
    </div>

    <div class="forgotpass">
    <a href="https://support.google.com/accounts/community-guide/381262272/forgot-password-google-account-recovery?hl=en" id="forgot">forgot password?</a>
    </div>

    </form>

    <div>

    <form form="fill" action="main.html">
    <button id="login" disabled>Log In</button>
    </form>

    </div>

</div>

</body>
</html>

<style>

    .DIV {
        border: 2px solid wheat;
        background-color: rgba(253, 159, 159, 0.229);
        padding: 30px;
        border-radius: 10px;
    }
    
    body {
        background-size: 400% 400%;
        background-image: linear-gradient(-45deg, wheat, rgb(64, 1, 1), rgb(172, 12, 12));
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: moveGradient 15s ease infinite;
    }

    @keyframes moveGradient {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

        .form{
            text-align: center;
        }

        .please {
            text-align: center;
            margin: 0;
        }

        #pl {
            color: wheat;
            margin-top: 0;
            margin-bottom: 20px;  
            font-family: roboto;
            font-weight: bold;
        }

        #input-email {
            margin-left: 8px;
            padding: 15px 10px;
            border-radius: 5px;
            border-color: wheat;
            margin-bottom: 10px;
            background-color: transparent;
            border-style: solid;
            color: wheat;
        }

        :hover#input-email {
            background-color: wheat;
            transition: 0.5s;
            color: black;
        }

        #input-pass {
            margin-left: 8px;
            background-color: transparent;
            padding: 15px 10px;
            border-radius: 5px;
            border-color: wheat;
            margin-bottom: 10px;
            border-style: solid;
            color: wheat;
        }

        :hover#input-pass {
            background-color: wheat;
            transition: 0.5s;
            color: black;
        }

        .forgotpass {
            text-align: center;
            margin: 0px 10px 30px 10px;
        }

        #forgot {
            color: white;
            margin: 0px;
            text-align: center;
            text-decoration: none;
            text-shadow: 0 0 5px black;
            font-size: 12px;
        }

        :hover#forgot {
            color: wheat;
            transition: 0.3s;
        }
        
        #login {
            color: wheat;
            border-radius: 5px;
            border: 1.5px solid wheat;
            background-color: rgb(100, 38, 12);
            padding: 10px;
            border-style: solid;
            margin-left: 7px;
            padding: 10px 73px 10px 73px;
        }

        :hover#login {
            background-color: transparent;
            cursor: pointer;
            transition: 0.5s;
            color: white;
            text-shadow: 0 0 10px black;
        }

        .button-container {
            margin-top: 10px;
            display: flex;
            gap: 80px;
            align-items: center;
        }

        input::placeholder {
            color: wheat;
        }

        input:hover::placeholder {
            color: rgb(60, 60, 60);
            border: 5px;
        }

</style>


<script>

const form = document.getElementById('fill');
const requiredFields = document.querySelectorAll('.required-field');
const submitBtn = document.getElementById('login');

function checkFormValidity() {
let allFilled = true;

  // Loop through all fields to check if any are empty
  requiredFields.forEach(field => {
    if (field.value.trim() === '') {
      allFilled = false;
    }
  });

  // Enable the button if all fields are filled, otherwise keep it disabled
  login.disabled = !allFilled;
}

// Listen for inputs on the entire form
form.addEventListener('input', checkFormValidity);

</script>
